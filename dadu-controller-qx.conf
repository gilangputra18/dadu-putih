[rewrite_remote]
https://dadu-putih1.vercel.app/proxy-script.js, tag=Dadu Controller, enabled=true

[rewrite_local]
^https://www\.google\.com/search\?.*dadu url script-response-body https://dadu-putih1.vercel.app/proxy-script.js

[mitm]
hostname = www.google.com

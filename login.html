<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Akun - Google</title>
    <link rel="icon" href="//www.gstatic.com/images/branding/searchlogo/ico/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0e0e0e;
            color: #e3e3e3;
            font-family: 'Roboto', 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 36px 20px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Google Logo */
        .google-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .google-logo-svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .google-logo-text {
            font-size: 20px;
            font-weight: 500;
            color: #e8eaed;
            font-family: 'Google Sans', Roboto, sans-serif;
            letter-spacing: -0.3px;
        }

        .header-title {
            font-size: 24px;
            color: #ffffff;
            font-weight: 400;
            margin-bottom: 8px;
            font-family: 'Google Sans', Roboto, sans-serif;
            letter-spacing: -0.2px;
        }

        .header-subtitle {
            font-size: 14px;
            color: #c4c7c5;
            margin-bottom: 24px;
            line-height: 20px;
        }

        .header-subtitle b {
            color: #ffffff;
            font-weight: 500;
        }

        /* Account List */
        .account-list {
            list-style: none;
            border-top: 1px solid #282a2c;
            margin-bottom: 4px;
        }

        .account-item {
            display: flex;
            align-items: center;
            padding: 13px 4px;
            border-bottom: 1px solid #282a2c;
            cursor: pointer;
            transition: background-color 0.15s ease;
            position: relative;
        }

        .account-item:active, .account-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: #ffffff;
            margin-right: 16px;
            flex-shrink: 0;
            text-transform: uppercase;
            font-family: 'Google Sans', Roboto, sans-serif;
        }

        .account-info {
            flex: 1;
            min-width: 0;
        }

        .account-name {
            font-size: 15px;
            font-weight: 500;
            color: #e3e3e3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 20px;
        }

        .account-email {
            font-size: 13px;
            color: #8e918f;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 18px;
        }

        .btn-remove-acc {
            background: transparent;
            border: none;
            color: #8e918f;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: color 0.15s, background-color 0.15s;
        }

        .btn-remove-acc:hover {
            color: #f28b82;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .use-other-row {
            display: flex;
            align-items: center;
            padding: 15px 4px;
            border-bottom: 1px solid #282a2c;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .use-other-row:active, .use-other-row:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .icon-circle svg {
            width: 24px;
            height: 24px;
            fill: #c4c7c5;
        }

        .use-other-text {
            font-size: 15px;
            font-weight: 500;
            color: #e3e3e3;
        }

        .terms-notice {
            font-size: 12px;
            color: #8e918f;
            line-height: 18px;
            margin-top: 24px;
        }

        .terms-notice a {
            color: #8ab4f8;
            text-decoration: none;
        }

        /* Sign-in Form Card */
        .login-card {
            background: #1e1f20;
            border: 1px solid #3c4043;
            border-radius: 16px;
            padding: 24px 20px;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: #c4c7c5;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .text-input {
            width: 100%;
            background: #131314;
            border: 1px solid #5f6368;
            border-radius: 8px;
            padding: 13px 14px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .text-input:focus {
            border-color: #8ab4f8;
            box-shadow: 0 0 0 1px #8ab4f8;
        }

        .text-input::placeholder {
            color: #6e7174;
        }

        .input-hint {
            font-size: 12px;
            color: #8e918f;
            margin-top: 6px;
            line-height: 16px;
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
            gap: 12px;
        }

        .btn-pill {
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: 'Google Sans', Roboto, sans-serif;
            transition: background-color 0.15s, opacity 0.15s;
        }

        .btn-primary {
            background: #8ab4f8;
            color: #001d35;
        }

        .btn-primary:hover {
            background: #93bcf8;
        }

        .btn-secondary {
            background: transparent;
            color: #8ab4f8;
        }

        .btn-secondary:hover {
            background: rgba(138, 180, 248, 0.08);
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding: 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8e918f;
            border-top: 1px solid #202124;
            max-width: 480px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .footer-lang {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .footer-links {
            display: flex;
            gap: 16px;
        }

        .footer-links a {
            color: #8e918f;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #c4c7c5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Google Header -->
        <div class="google-header">
            <svg class="google-logo-svg" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.88c2.27-2.09 3.665-5.17 3.665-9.09z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.09C3.26 21.37 7.33 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.32c-.25-.72-.38-1.49-.38-2.32s.14-1.6.38-2.32V6.59H1.24C.45 8.16 0 9.97 0 12c0 2.03.45 3.84 1.24 5.41l4.04-3.09z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.63 1.24 6.59l4.04 3.09c.95-2.83 3.6-4.93 6.72-4.93z"/>
            </svg>
            <span class="google-logo-text">Google</span>
        </div>

        <h1 class="header-title" id="header-title">Pilih akun</h1>
        <div class="header-subtitle" id="header-subtitle">
            untuk melanjutkan ke <b id="site-domain">hafizgaming.my.id</b>
        </div>

        <!-- Section 1: Daftar Akun Perangkat -->
        <div id="section-account-list">
            <ul class="account-list" id="account-list">
                <!-- Diisi dinamis hanya dengan akun yang ada di perangkat ini -->
            </ul>

            <div class="use-other-row" id="btn-use-other">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                </div>
                <div class="use-other-text">Gunakan akun lain</div>
            </div>

            <div class="terms-notice">
                Untuk melanjutkan, Google akan membagikan nama, alamat email, dan preferensi bahasa Anda dengan <span id="site-domain-notice">hafizgaming.my.id</span>.
            </div>
        </div>

        <!-- Section 2: Form Masuk / Tambah Akun Perangkat -->
        <div id="section-account-form" style="display: none;">
            <div class="login-card">
                <form id="form-add-account">
                    <div class="input-group">
                        <label class="input-label" for="input-email">Email Akun Google (Gmail)</label>
                        <input type="email" class="text-input" id="input-email" name="email" placeholder="contoh@gmail.com" autocomplete="email username" required>
                        <div class="input-hint">Gunakan akun Gmail yang tersimpan di perangkat ini.</div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="input-name">Nama Akun (Opsional)</label>
                        <input type="text" class="text-input" id="input-name" name="name" placeholder="Nama tampilan akun" autocomplete="name">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-pill btn-secondary" id="btn-form-cancel">Kembali</button>
                        <button type="submit" class="btn-pill btn-primary">Lanjutkan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Standar Google -->
    <div class="footer">
        <div class="footer-lang">
            <span>Indonesia</span>
            <svg style="width:12px;height:12px;fill:#8e918f" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
        <div class="footer-links">
            <a href="#">Bantuan</a>
            <a href="#">Privasi</a>
            <a href="#">Persyaratan</a>
        </div>
    </div>

    <script>
        // Set nama domain dinamis
        const currentHost = window.location.hostname || 'hafizgaming.my.id';
        const displayHost = currentHost.replace(/^www\./, '');
        document.getElementById('site-domain').textContent = displayHost;
        document.getElementById('site-domain-notice').textContent = displayHost;

        let isExplicitAddMode = false;

        // Ambil akun yang HANYA tersimpan di perangkat pengguna saat ini (tanpa template orang lain)
        function getDeviceAccounts() {
            try {
                const stored = localStorage.getItem('google_device_accounts');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch(e) {}
            return []; // Bersih: Tidak ada akun bawaan/template yang di-hardcode
        }

        function saveDeviceAccounts(accounts) {
            localStorage.setItem('google_device_accounts', JSON.stringify(accounts));
        }

        function selectAccount(account) {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userName', account.name);
            localStorage.setItem('userEmail', account.email);
            localStorage.setItem('userInitial', account.initial || account.name.charAt(0).toUpperCase());
            localStorage.setItem('userColor', account.color || '#4285f4');

            // Kembali ke halaman utama
            window.location.href = '/';
        }

        function removeAccount(idx, e) {
            e.stopPropagation();
            const accounts = getDeviceAccounts();
            accounts.splice(idx, 1);
            saveDeviceAccounts(accounts);
            renderView();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderView() {
            const accounts = getDeviceAccounts();
            const sectionList = document.getElementById('section-account-list');
            const sectionForm = document.getElementById('section-account-form');
            const headerTitle = document.getElementById('header-title');
            const headerSubtitle = document.getElementById('header-subtitle');
            const btnCancel = document.getElementById('btn-form-cancel');

            if (accounts.length > 0 && !isExplicitAddMode) {
                // Tampilkan Daftar Akun yang ada di perangkat ini
                sectionList.style.display = 'block';
                sectionForm.style.display = 'none';
                headerTitle.textContent = 'Pilih akun';
                headerSubtitle.innerHTML = `untuk melanjutkan ke <b style="color:#ffffff;">${displayHost}</b>`;

                const list = document.getElementById('account-list');
                list.innerHTML = '';

                accounts.forEach((acc, idx) => {
                    const li = document.createElement('li');
                    li.className = 'account-item';
                    li.innerHTML = `
                        <div class="avatar" style="background-color: ${acc.color || '#4285f4'};">${escapeHtml(acc.initial || acc.name.charAt(0).toUpperCase())}</div>
                        <div class="account-info">
                            <div class="account-name">${escapeHtml(acc.name)}</div>
                            <div class="account-email">${escapeHtml(acc.email)}</div>
                        </div>
                        <button type="button" class="btn-remove-acc" title="Hapus dari perangkat ini" aria-label="Hapus">&times;</button>
                    `;
                    li.addEventListener('click', () => selectAccount(acc));
                    li.querySelector('.btn-remove-acc').addEventListener('click', (e) => removeAccount(idx, e));
                    list.appendChild(li);
                });
            } else {
                // Tampilkan Form Masuk / Tambah Akun (jika belum ada akun sama sekali atau klik Gunakan akun lain)
                sectionList.style.display = 'none';
                sectionForm.style.display = 'block';
                headerTitle.textContent = 'Login';
                headerSubtitle.innerHTML = `Lanjutkan ke <b style="color:#ffffff;">${displayHost}</b>`;

                if (accounts.length > 0) {
                    btnCancel.textContent = 'Kembali ke daftar akun';
                } else {
                    btnCancel.textContent = 'Kembali ke Beranda';
                }

                setTimeout(() => {
                    const emailInput = document.getElementById('input-email');
                    if (emailInput) emailInput.focus();
                }, 100);
            }
        }

        // Tombol Gunakan Akun Lain
        document.getElementById('btn-use-other').addEventListener('click', () => {
            isExplicitAddMode = true;
            renderView();
        });

        // Tombol Batal/Kembali pada Form
        document.getElementById('btn-form-cancel').addEventListener('click', () => {
            const accounts = getDeviceAccounts();
            if (accounts.length > 0 && isExplicitAddMode) {
                isExplicitAddMode = false;
                renderView();
            } else {
                window.location.href = '/';
            }
        });

        // Submit Form Akun Baru
        document.getElementById('form-add-account').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('input-email').value.trim();
            const name = document.getElementById('input-name').value.trim();

            if (!email || !email.includes('@')) {
                alert('Silakan masukkan alamat email yang valid.');
                return;
            }

            const displayName = name || email.split('@')[0];
            const initial = (displayName.charAt(0) || email.charAt(0)).toUpperCase();
            const colors = ["#4285f4", "#ea4335", "#fbbc05", "#34a853", "#e91e63", "#00897b", "#0288d1", "#8e24aa", "#d81b60", "#607d8b"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const newAcc = {
                name: displayName,
                email: email,
                initial: initial,
                color: randomColor
            };

            const accounts = getDeviceAccounts();
            const existingIdx = accounts.findIndex(a => a.email.toLowerCase() === email.toLowerCase());
            if (existingIdx !== -1) {
                accounts[existingIdx] = newAcc;
            } else {
                accounts.unshift(newAcc);
            }

            saveDeviceAccounts(accounts);
            selectAccount(newAcc);
        });

        // Inisialisasi tampilan
        renderView();
    </script>
</body>
</html>
